<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Busca tu equipo o jugadora favorita y descubre su historia, logros y datos curiosos en nuestra wiki de fútbol femenino.">
    <title>Jugadoras - FutFemWiki</title>
    
    <link id="favicon" rel="icon" href="img/logo.webp">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.3.2/css/flag-icons.min.css" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@100..900&family=Oswald:wght@200..700&family=Plus+Jakarta+Sans:wght@200..800&family=Russo+One&display=swap" media="print" onload="this.media='all'"> 

    <link rel="modulepreload" href="js/api/pais.js">
    <link rel="modulepreload" href="js/api/equipos.js">
    <link rel="modulepreload" href="js/api/jugadora.js">
    <link rel="modulepreload" href="js/wiki.js">

    <link rel="stylesheet" href="css/bootstrap.css">
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/combo.css">
    <link rel="stylesheet" href="css/wiki.css">
    <link rel="stylesheet" href="css/jugadoras.css">
</head>
<body>

<header class="navbar">
    <div class="header-container">
        <a href="index.html" class="logo-link">
            <img src="img/logo.webp" alt="Logo FutFemWiki" class="logo-img">
        </a>
        <nav class="nav-container">
            <ul class="nav-links">
                <li><a href="jugadoras.html" class="active">Jugadoras</a></li>
                <li><a href="equipos.html">Equipos</a></li>
            </ul>
        </nav>
    </div>
</header>

<section id="wiki-equipos">
    <div id="wiki-container">
        
        <!-- Cabecera y Filtros -->
        <div id="cabecera-wiki-equipos">
            <div id="cabecera-jugadora" class="panel">
                <h2>Selección de Jugadora</h2>
                <div id="filtros">
                    <div>
                        <label for="input-equipo">Equipo:</label>
                        <input id="input-equipo" type="text" name="equipo" placeholder="Buscar por equipo..." autocomplete="off">
                        <div class="sugerencias-container">
                            <ul id="sugerencias-equipo"></ul>
                        </div>
                    </div>
                    <div>
                        <label for="input-pais">Nacionalidad:</label>
                        <input id="input-pais" class="input-pais" name="pais" type="text" placeholder="Buscar por país..." autocomplete="off">
                        <div class="sugerencias-container">
                            <ul id="sugerencias-pais2"></ul>
                        </div>
                    </div>
                    <div>
                        <label for="input-posicion">Posición:</label>
                        <input id="input-posicion" class="input-posicion" name="posicion" type="text" placeholder="Buscar por posición..." autocomplete="off">
                        <div class="sugerencias-container">
                            <ul id="sugerencias-posicion" style="padding: unset;"></ul>
                        </div>
                    </div>
                </div>
                <div id="pagination" class="pagination"></div>
            </div>
        </div>

        <!-- Encabezado de la Tabla (Sticky) -->
        <div class="jugadora-item header-list">
            <div class="jugadora-div1"><p><b>JUGADORA</b></p></div>
            <div class="header-label"><p><b>EDAD</b></p></div>
            <div class="header-label"><p><b>CLUB</b></p></div>
            <div class="header-label"><p><b>VALOR</b></p></div>
        </div>

        <!-- Contenedor SCROLLABLE con las Jugadoras -->
        <div id="items-container"></div>

        <div id="config-wiki" data-seccion="jugadoras"></div>
    </div>
</section>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/gsap.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/color-thief/2.3.2/color-thief.umd.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous" defer></script>

<script type="module">
    import { iniciarJugadoras } from './js/jugadoras.js';
    document.addEventListener('DOMContentLoaded', () => {
        iniciarJugadoras();
    });
</script>

</body>
</html>
