<script>
    document.addEventListener('DOMContentLoaded', () => {
        AOS.init({
            once: false,   // Permite que la animación se repita al volver a la sección
            mirror: true   // Anima los elementos al desplazarse hacia arriba y hacia abajo
        });
    });
</script>
<script type="module">
    import { fetchAllJugadoras } from '/js/api/jugadora.js';
    import { fetchAllEquipos } from '/js/api/equipos.js';
    import { CanvasBackground } from '/js/index.js';

    // Instancia para la sección Hero
    const heroCanvas = new CanvasBackground('canvas', {
        colors: ["#210936", "#836FFF", "#FF007A"] // Cyberpunk
    });

    const jugadoras = await fetchAllJugadoras();
    const equipos = await fetchAllEquipos();

    localStorage.setItem('todas_jugadoras', JSON.stringify(jugadoras));
    localStorage.setItem('todos_equipos', JSON.stringify(equipos));

    const sectionJugadoras = document.getElementById('jugadoras');
    const sectionEquipos = document.getElementById('equipos');

    // Función auxiliar para mezclar arrays
    function mezclarFotos(array) {
        const copia = [...array];
        for (let i = copia.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [copia[i], copia[j]] = [copia[j], copia[i]];
        }
        return copia;
    }

    // Helper para verificar URL válida
    function esUrlValida(url) {
        if (!url || typeof url !== 'string') return false;
        
        const urlLimpia = url.trim().toLowerCase();
        if (urlLimpia === '' || urlLimpia === 'null' || urlLimpia === 'undefined' || urlLimpia === 'none') {
            return false;
        }
        
        try {
            new URL(url, window.location.origin);
            return true;
        } catch (_) {
            return false;
        }
    }

    // --- MARQUESINA DE JUGADORAS (VERTICAL / COLUMNAS) ---
    function crearFondoJugadoras(listaJugadoras) {
        if (!listaJugadoras || listaJugadoras.length === 0) return;

        // 1. Filtrar solo imágenes válidas
        const fotosBase = listaJugadoras
            .map(j => j?.foto || j?.imagen)
            .filter(esUrlValida);

        if (fotosBase.length === 0) return;

        const marqueeBg = document.createElement('div');
        marqueeBg.className = 'bg-marquee';

        for (let i = 0; i < 5; i++) {
            const col = document.createElement('div');
            col.className = `marquee-col ${i % 2 === 0 ? 'scroll-up' : 'scroll-down'}`;

            // Contenedor principal de imágenes (Pista original)
            const track = document.createElement('div');
            track.className = 'marquee-track';

            // Garantizar al menos 15 elementos para llenar pantallas grandes
            const baseShuffled = mezclarFotos(fotosBase);
            let fotosColumna = [...baseShuffled];
            while (fotosColumna.length < 15) {
                fotosColumna = [...fotosColumna, ...baseShuffled];
            }

            fotosColumna.forEach(url => {
                const img = document.createElement('img');
                img.src = url;
                img.alt = 'Jugadora';
                img.loading = 'lazy';

                // 🛡️ Si da error 404, se oculta sin alterar el alto global
                img.onerror = function() {
                    this.style.display = 'none';
                };

                track.appendChild(img);
            });

            // 🔄 Clon idéntico de la pista para empalme infinito perfecto
            const trackClon = track.cloneNode(true);
            
            // Reasignar el handler de error al clon (cloneNode no copia event listeners de JS)
            trackClon.querySelectorAll('img').forEach(img => {
                img.onerror = function() {
                    this.style.display = 'none';
                };
            });

            col.appendChild(track);
            col.appendChild(trackClon);
            marqueeBg.appendChild(col);
        }

        const overlay = document.createElement('div');
        overlay.className = 'bg-overlay';

        sectionJugadoras.prepend(overlay);
        sectionJugadoras.prepend(marqueeBg);
    }

    // --- MARQUESINA DE EQUIPOS (HORIZONTAL / FILAS) ---
    function crearFondoEquipos(listaEquipos) {
        if (!listaEquipos || listaEquipos.length === 0) return;

        const fotosBase = listaEquipos
            .map(e => e?.escudo || e?.foto || e?.imagen || e?.logo)
            .filter(esUrlValida);

        if (fotosBase.length === 0) return;

        const marqueeBg = document.createElement('div');
        marqueeBg.className = 'bg-marquee-equipos';

        for (let i = 0; i < 4; i++) {
            const row = document.createElement('div');
            row.className = `marquee-row ${i % 2 === 0 ? 'scroll-left' : 'scroll-right'}`;

            // Contenedor principal de escudos (Pista original)
            const track = document.createElement('div');
            track.className = 'marquee-track-h';

            const baseShuffled = mezclarFotos(fotosBase);
            let fotosFila = [...baseShuffled];
            while (fotosFila.length < 15) {
                fotosFila = [...fotosFila, ...baseShuffled];
            }

            fotosFila.forEach(url => {
                const img = document.createElement('img');
                img.src = url;
                img.alt = 'Equipo';
                img.loading = 'lazy';

                img.onerror = function() {
                    this.style.display = 'none';
                };

                track.appendChild(img);
            });

            // 🔄 Clon idéntico para loop continuo
            const trackClon = track.cloneNode(true);
            trackClon.querySelectorAll('img').forEach(img => {
                img.onerror = function() {
                    this.style.display = 'none';
                };
            });

            row.appendChild(track);
            row.appendChild(trackClon);
            marqueeBg.appendChild(row);
        }

        const overlay = document.createElement('div');
        overlay.className = 'bg-overlay-equipos';

        sectionEquipos.prepend(overlay);
        sectionEquipos.prepend(marqueeBg);
    }

    // Ejecución
    crearFondoJugadoras(jugadoras);
    crearFondoEquipos(equipos.success);

    AOS.refresh();


    // --- CONTROL DE SCROLL SECCIÓN POR SECCIÓN ---
    // --- CONTROL DE DESPLAZAMIENTO POR SECCIONES ---
const wrapper = document.querySelector('.sections-wrapper');
const secciones = document.querySelectorAll('section');
const enlacesMenu = document.querySelectorAll('#menu a');

let indiceSeccionActual = 0;
let estaAnimando = false;

// 1. Evento de Rueda de Ratón (Escritorio)
window.addEventListener('wheel', (e) => {
    e.preventDefault();

    if (estaAnimando) return;

    if (e.deltaY > 0 && indiceSeccionActual < secciones.length - 1) {
        indiceSeccionActual++;
        cambiarDeSeccion(indiceSeccionActual);
    } else if (e.deltaY < 0 && indiceSeccionActual > 0) {
        indiceSeccionActual--;
        cambiarDeSeccion(indiceSeccionActual);
    }
}, { passive: false });

// 2. Eventos Táctiles (Móviles / Tablets)
let touchStartY = 0;
window.addEventListener('touchstart', (e) => {
    touchStartY = e.touches[0].clientY;
}, { passive: true });

window.addEventListener('touchend', (e) => {
    if (estaAnimando) return;

    const touchEndY = e.changedTouches[0].clientY;
    const diferencia = touchStartY - touchEndY;

    // Deslizar hacia arriba (Siguiente)
    if (diferencia > 50 && indiceSeccionActual < secciones.length - 1) {
        indiceSeccionActual++;
        cambiarDeSeccion(indiceSeccionActual);
    } 
    // Deslizar hacia abajo (Anterior)
    else if (diferencia < -50 && indiceSeccionActual > 0) {
        indiceSeccionActual--;
        cambiarDeSeccion(indiceSeccionActual);
    }
});

// 3. Función principal para desplazar el contenedor y actualizar el menú
function cambiarDeSeccion(indice) {
    estaAnimando = true;

    // 1. Desplaza el contenedor
    wrapper.style.transform = `translateY(-${indice * 100}vh)`;

    // 2. Actualiza el menú activo
    const idSeccion = secciones[indice].getAttribute('id');
    enlacesMenu.forEach(enlace => {
        const esActivo = enlace.getAttribute('href') === `#${idSeccion}`;
        enlace.classList.toggle('active', esActivo);
    });

    // 3. 🎯 CONTROL MANUAL DE AOS:
    // Reinicia las animaciones quitando la clase de todas las secciones
    document.querySelectorAll('[data-aos]').forEach(el => {
        el.classList.remove('aos-animate');
    });

    // Añade 'aos-animate' a los elementos de la sección objetivo tras un breve retardo
    setTimeout(() => {
        const seccionObjetivo = secciones[indice];

        // Anima la sección si tiene data-aos
        if (seccionObjetivo.hasAttribute('data-aos')) {
            seccionObjetivo.classList.add('aos-animate');
        }

        // Anima los hijos que tengan data-aos dentro de esa sección
        seccionObjetivo.querySelectorAll('[data-aos]').forEach(el => {
            el.classList.add('aos-animate');
        });

        estaAnimando = false;
    }, 300); // 300ms permite que la transición comience mientras la sección entra en pantalla
}

cambiarDeSeccion(0)

// 4. Intercepta los clics en las pestañas del menú inferior
enlacesMenu.forEach(enlace => {
    enlace.addEventListener('click', (e) => {
        e.preventDefault();
        const targetId = enlace.getAttribute('href').replace('#', '');
        const targetIndex = Array.from(secciones).findIndex(sec => sec.id === targetId);

        if (targetIndex !== -1 && targetIndex !== indiceSeccionActual) {
            indiceSeccionActual = targetIndex;
            cambiarDeSeccion(indiceSeccionActual);
        }
    });
});

    
</script>
