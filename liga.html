<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/gsap.min.js" defer></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/color-thief/2.3.2/color-thief.umd.js" defer></script>
<script type="module">
    import { inicializarEquiposLiga } from '/js/equipos-liga.js';

    // 1. Capturamos los parámetros del Query String de la URL actual (?id=X)
    const urlParams = new URLSearchParams(window.location.search);
    const idLiga = urlParams.get('id');

    // 2. Validamos que exista un ID antes de inicializar
    if (idLiga) {
        await inicializarEquiposLiga(idLiga);
    } else {
        console.error('No se proporcionó ningún ID de liga en la URL.');
        // Opcional: Redirigir a la página principal si no hay ID
        // window.location.href = '/index.html';
    }
</script>
