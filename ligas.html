    <style>
        .custom-dropdown {
            position: relative;
            width: 250px;
            font-family: 'Arial', sans-serif;
            height: 100%;
        }

        @media (max-width: 600px) {
            .custom-dropdown {
                width: 100%;
                /*max-width: 45%;*/
            }
            .dropdown-menu {
                width: 100%;
                max-width: 50%;
            }
        }

        /* Asegúrate de que el botón de la maqueta tenga una altura y sea visible */
        .dropdown-trigger {
            display: flex !important; /* Fuerza el renderizado flex */
            visibility: visible !important;
            opacity: 1 !important;
            min-height: 40px; /* Le da una altura mínima por si acaso */
        }

        /* Evita que flag-icons rompa si el código es 'xx' (por defecto) */
        .fi-xx {
            display: inline-block;
            width: 16px;
            height: 12px;
            background-color: rgba(255, 255, 255, 0.2); /* Un rectángulo sutil mientras carga */
        }

        /* El botón disparador */
        .dropdown-trigger {
            width: 100%;
            background: rgba(40, 10, 55, 0.8); /* Morado oscuro semitransparente como tus menús */
            border: 2px solid #bd00ff; /* Borde de neón brillante */
            color: #fff;
            padding: 10px 15px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 12px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .dropdown-trigger:hover {
            background: rgba(65, 15, 90, 0.9);
            box-shadow: 0 0 10px rgba(189, 0, 255, 0.5);
        }

        .arrow-icon {
            margin-left: auto;
            font-size: 0.8em;
        }

        /* La lista de opciones */
        .dropdown-menu {
            position: absolute;
            top: 105%;
            left: 0;
            width: 100%;
            background: #1e052c;
            border: 2px solid #bd00ff;
            border-radius: 8px;
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 300px;
            overflow-y: auto;
            z-index: 1000;
            display: none; /* Oculto por defecto */
        }

        /* Cuando añadimos la clase .open mediante JS */
        .dropdown-menu.open {
            display: block;
        }

        /* Cada fila de país */
        .dropdown-item {
            padding: 10px 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #fff;
            cursor: pointer;
            transition: background 0.2s ease;
            border-radius: 0;   
            margin-bottom: 0 !important; /* Elimina el margen entre items para que el fondo se vea como un bloque sólido */
        }

        .dropdown-item:hover {
            background: #bd00ff; /* Cambio de color FIFA al pasar el cursor */
        }

        /* Ajuste fino para los iconos de bandera */
        .fi {
            border-radius: 3px;
            box-shadow: 0 0 3px rgba(0,0,0,0.3);
        }
    </style>
    
    <!-- Vercel Speed Insights -->
